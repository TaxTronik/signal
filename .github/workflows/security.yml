name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.24.3

jobs:
  dependencies:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pip-audit
        run: python -m pip install pip-audit

      # Nur die LAUFZEIT-Deps prüfen (analog zu 'pnpm audit --prod'): das, was beim
      # produktiven Einsatz tatsächlich importiert wird. numpy ist de-facto Pflicht
      # (s. ci.yml). Test-/Build-Tooling (pytest, pip-audit) bleibt außen vor, damit
      # eine Advisory in einer Dev-Abhängigkeit die CI nicht grundlos rot färbt.
      - name: Audit runtime dependencies
        run: |
          printf 'PyYAML>=6.0\nnumpy>=1.26\n' > runtime-requirements.txt
          python -m pip_audit -r runtime-requirements.txt --desc

  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -fsSL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          chmod +x /tmp/gitleaks

      # § 203 StGB: fängt versehentlich committete Secrets/Mandantendaten ab
      # (z. B. .engine_token, Tokens) – die History wird mitgescannt (fetch-depth 0).
      - name: Scan repository
        run: /tmp/gitleaks detect --source . --redact --verbose
