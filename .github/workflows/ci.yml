name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # Dependencies BEWUSST minimal halten:
      #   * PyYAML  – einzige Kern-Laufzeitabhängigkeit (pyproject [project].dependencies)
      #   * pytest  – das 'dev'-Extra
      #   * numpy   – de-facto Pflicht: embedding.py importiert numpy am Modulkopf und
      #               web.py importiert embedding. numpy steckt aber im 'embedding'-Extra,
      #               das zusätzlich sentence-transformers + torch (~2 GB) zöge.
      #               Die Tests brauchen torch/sentence-transformers NICHT (lazy import,
      #               HashEncoder-Fallback) – also installieren wir sie bewusst NICHT.
      # Ebenfalls bewusst NICHT installiert: das 'service'-Extra (fastapi/uvicorn, von
      # keinem Test importiert) sowie 'llm' (llama-cpp-python) und 'nlp' (spacy).
      - name: Install dependencies (minimal, kein torch)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" "numpy>=1.26"

      # Schnelles, versionsspezifisches "parst es überhaupt?"-Gate vor dem Testlauf.
      - name: Byte-compile
        run: python -m compileall -q risk_layer tests

      # Die Suite ist artefakt-frei: Tests bauen Mini-Normgraph/Embedding-Index selbst
      # aus tests/fixtures/ (kein corpus/graph.sqlite, kein corpus/embedding/ nötig).
      - name: Run tests
        run: python -m pytest -q
