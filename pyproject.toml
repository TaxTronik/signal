[project]
name = "risk-layer"
version = "0.1.0"
description = "Schlüsselbegriff-Assistenz für die steuerliche Risikosteuerung (Risk-Layer / Schlüsselbegriff-Detektor)"
readme = "README.md"
# >=3.11.4: tarfile kennt den extract-Filter "data" (Schutz gegen Path-Traversal
# beim Entpacken) erst ab 3.11.4 — risk_layer/modell.py nutzt ihn beim Engine-Download.
requires-python = ">=3.11.4"
authors = [
    { name = "Hirschmann & Koxha GbR", email = "rey.koxha@gmail.com" },
]
license = { text = "AGPL-3.0-or-later" }
dependencies = [
    "PyYAML>=6.0",
    "numpy>=1.26,<2.3",
]

[project.optional-dependencies]
# Stufe 0 (MVP) läuft ohne diese Extras. Sie gehören zu den Ausbaustufen.
nlp = ["spacy>=3.7", "click>=8.1"]  # /LF50/ Lemmatisierung (de_core_news_lg) – optionaler Robustheitspfad
llm = ["llama-cpp-python>=0.2"]  # Schicht 2 (Stufe 1) – Kandidatenerkennung
embedding = ["sentence-transformers>=2.7"]  # Schicht 1.7 (BGE-M3; numpy ist Kernabhängigkeit)
quanten = ["qiskit>=1.0", "qiskit-ibm-runtime>=0.30", "qiskit-aer>=0.15"]  # Quantenlos (Entropie-Notar) – risk_layer/quantenlos.py
dev = ["pytest>=8.0"]

[project.scripts]
risk-layer = "risk_layer.cli:main"
risk-layer-web = "risk_layer.web:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["risk_layer"]

[tool.setuptools.package-data]
risk_layer = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Repo-Wurzel auf den Importpfad: so laeuft `pytest -q` direkt aus dem Clone,
# auch ohne vorheriges `pip install --no-build-isolation --no-deps -e .`
# (sonst ModuleNotFoundError: risk_layer).
pythonpath = ["."]
