- quell_norm: norm:UStG:9
  typ: paraphrase
  funktion: unklar
  inhalt: Bei Grundstücksvermietung, Verpachtung oder Erbbaurecht soll geprüft werden, ob der Leistungsempfänger
    die Fläche nur für vorsteuerunschädliche Umsätze nutzt und dies belegbar ist.
  textgrundlage: Der Verzicht auf Steuerbefreiung nach Absatz 1 ist bei der Bestellung und Übertragung
    von Erbbaurechten (§ 4 Nr. 9 Buchstabe a), bei der Vermietung oder Verpachtung von Grundstücken (§
    4 Nr. 12 Satz 1 Buchstabe a) und bei den in § 4 Nr. 12 Satz 1 Buchstabe b und c bezeichneten Umsätzen
    nur zulässig, soweit der Leistungsempfänger das Grundstück ausschließlich für Umsätze verwendet oder
    zu verwenden beabsichtigt, die den Vorsteuerabzug nicht ausschließen. Der Unternehmer hat die Voraussetzungen
    nachzuweisen.
