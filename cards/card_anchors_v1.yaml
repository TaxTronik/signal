- quell_norm: norm:UStG:9
  typ: paraphrase
  funktion: unklar
  inhalt: Beim Grundstücksverkauf ist wichtig, ob die Option rechtzeitig im Zwangsversteigerungstermin
    oder im notariellen Vertrag erklärt wird.
  textgrundlage: Der Verzicht auf Steuerbefreiung nach Absatz 1 ist bei Lieferungen von Grundstücken (§
    4 Nr. 9 Buchstabe a) im Zwangsversteigerungsverfahren durch den Vollstreckungsschuldner an den Ersteher
    bis zur Aufforderung zur Abgabe von Geboten im Versteigerungstermin zulässig. Bei anderen Umsätzen
    im Sinne von § 4 Nummer 9 Buchstabe a kann der Verzicht auf Steuerbefreiung nach Absatz 1 nur in dem
    gemäß § 311b Absatz 1 des Bürgerlichen Gesetzbuchs notariell zu beurkundenden Vertrag erklärt werden.
