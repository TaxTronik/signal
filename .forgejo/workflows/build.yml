# Forgejo-nativer BUILD-Workflow. Schwester-Workflows im selben Verzeichnis:
# ci.yml (Quality/Tests) + security.yml (pip-audit/gitleaks) — hier NUR:
# Deploy-Artefakte validieren + die zustandslose Engine als Container bauen
# (und optional in die Forgejo-Registry pushen).
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-deploy:
    name: Deploy-Artefakte validieren
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Bash-Syntax (deploy.sh, build-release-artifact.sh)
        run: bash -n deploy.sh && bash -n build-release-artifact.sh

      # PowerShell-Parse-Check OPPORTUNISTISCH: läuft nur, falls pwsh im
      # Runner-Image vorhanden ist (kein Windows-Runner in der Flotte — bewusst
      # KEIN runs-on: windows, das würde ohne Runner ewig queuen; vgl. den
      # Kommentarblock in ci.yml). Reiner Syntax-Gate via PowerShell-Parser,
      # kein PSScriptAnalyzer.
      - name: PowerShell-Syntax (deploy.ps1, install-service.ps1, build-release-artifact.ps1)
        run: |
          if command -v pwsh >/dev/null 2>&1; then
            pwsh -NoProfile -Command '
              $gesamt = 0
              foreach ($f in "deploy.ps1","install-service.ps1","build-release-artifact.ps1") {
                $tokens = $null; $fehler = $null
                [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f).Path, [ref]$tokens, [ref]$fehler)
                if ($fehler.Count -gt 0) {
                  $fehler | ForEach-Object { Write-Host "${f}: $($_.Extent.StartLineNumber): $($_.Message)" }
                  $gesamt += $fehler.Count
                } else { Write-Host "$f ok" }
              }
              exit ([int]($gesamt -gt 0))
            '
          else
            echo "::notice::pwsh nicht verfügbar — PS-Parse-Check übersprungen (kein Windows-Runner; siehe ci.yml)"
          fi

      - name: Python byte-compile (Engine)
        run: python -m compileall -q risk_layer

      - name: YAML + systemd-Template prüfen
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-lock.txt
          python -c "import yaml; yaml.safe_load(open('docker-compose.yml',encoding='utf-8')); print('compose ok')"
          # systemd-Template: nach Render bleibt kein @PLATZHALTER@ und [Service] existiert
          sed -e 's/@[A-Z_]*@/x/g' deploy/risk-layer.service.in > /tmp/u.service
          grep -q '^\[Service\]' /tmp/u.service && ! grep -qE '@[A-Z_]+@' /tmp/u.service && echo "systemd-template ok"

  engine-image:
    name: Engine-Image bauen${{ vars.PUBLISH == 'true' && ' + pushen' || '' }}
    needs: validate-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      REGISTRY: ${{ vars.REGISTRY || 'git.hirschmann-koxha.de' }}
      IMAGE: ${{ vars.REGISTRY || 'git.hirschmann-koxha.de' }}/taxtronik/risk-layer-engine
      # KEIN DOCKER_HOST hier: Docker-Zugriff im Job ist Admin-/Runner-Sache. Die
      # runner-config setzt ihn (runner.envs.DOCKER_HOST) + macht den Namen aufloesbar
      # (container.options --add-host). Genau wie das Doku-Beispiel ruft der Workflow
      # nur `docker build`. Vollstaendige Einrichtung: deploy/forgejo-runner.md.
    steps:
      - uses: actions/checkout@v4

      # DinD-Daemon erreichbar? — fail-fast mit klarer Meldung (Socket vs. tcp/DNS).
      - name: Docker-Daemon prüfen
        run: docker info >/dev/null && echo "docker-daemon ok"

      # Schlanker Build (ohne Embedding) = schnell; prüft, dass das Dockerfile baut.
      - name: Build engine image (schlank, ohne Embedding)
        run: docker build -t risk-layer-engine:ci .

      # Best-effort: nur falls das compose-v2-Plugin im Runner-Image vorhanden ist
      # (die YAML-Struktur wird ohnehin in validate-deploy per Python geprüft).
      - name: Compose config (best-effort)
        run: |
          if docker compose version >/dev/null 2>&1; then
            RISK_LAYER_TOKEN=ci docker compose config -q && echo "compose config ok"
          else
            echo "docker-compose-v2-Plugin im Runner-Image nicht vorhanden — uebersprungen (YAML bereits geprueft)"
          fi

      # Push NUR auf main/Tag UND wenn die Repo-Variable PUBLISH='true' gesetzt ist
      # (sonst bleibt die CI grün, bevor Registry-Secret/Variable konfiguriert sind).
      - name: Login + Push in die Forgejo-Registry
        if: vars.PUBLISH == 'true' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        run: |
          echo "${{ secrets.REGISTRY_TOKEN }}" | docker login "$REGISTRY" -u "${{ secrets.REGISTRY_USER || github.actor }}" --password-stdin
          TAG="${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.sha }}"
          docker tag risk-layer-engine:ci "$IMAGE:$TAG"
          docker tag risk-layer-engine:ci "$IMAGE:latest"
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"
          echo "gepusht: $IMAGE:$TAG (+ latest)"
