name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.24.3

jobs:
  dependencies:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pip-audit
        run: python -m pip install pip-audit

      # Nur die LAUFZEIT-Deps prüfen (analog zu 'pnpm audit --prod'), aber aus
      # dem Hash-Lock extrahiert: auditiert werden die produktiv autorisierten
      # Versionen, nicht neu aufgeloeste >=-Ranges.
      - name: Audit locked runtime dependencies
        run: |
          python - <<'PY'
          from pathlib import Path

          keep = {"numpy", "pyyaml"}
          locked = []
          for line in Path("requirements-lock.txt").read_text(encoding="utf-8").splitlines():
              if not line or line.startswith((" ", "#", "-")):
                  continue
              requirement = line.split("\\", 1)[0].strip()
              name = requirement.split("==", 1)[0].lower()
              if name in keep:
                  locked.append(requirement)
          Path("runtime-requirements.txt").write_text("\n".join(locked) + "\n", encoding="utf-8")
          PY
          python -m pip_audit -r runtime-requirements.txt --desc

  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -fsSL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          chmod +x /tmp/gitleaks

      # § 203 StGB: fängt versehentlich committete Secrets/Mandantendaten ab
      # (z. B. .engine_token, Tokens) – die History wird mitgescannt (fetch-depth 0).
      - name: Scan repository
        run: /tmp/gitleaks detect --source . --redact --verbose
