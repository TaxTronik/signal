name: Quality

# Bewusst (noch) NICHT in dieser CI: mypy, Coverage-Gate, Windows-Runner,
# PSScriptAnalyzer — zu schwergewichtig für den aktuellen Stand; bei Bedarf
# als eigene Jobs nachziehen. Windows-Runner bleibt offen; ein PS-Parse-Check
# (Syntax-Gate über die .ps1-Skripte) läuft inzwischen OPPORTUNISTISCH in
# build.yml, falls pwsh im Runner-Image vorhanden ist.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff, Runtime-Fehler-Niveau)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Konservativer Regelsatz, NUR Runtime-Fehler-Niveau (kein Stil-Bikeshedding):
      #   E9  – Syntax-/IO-Fehler,  F63 – ungültige Vergleiche/Assertions,
      #   F7  – Statement-Fehler (return außerhalb Funktion etc.),
      #   F82 – undefinierte Namen.
      - name: ruff check
        run: |
          python -m pip install --quiet ruff
          python -m ruff check --select E9,F63,F7,F82 risk_layer tools tests

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # '3.11' resolved im Runner auf den neuesten 3.11-Patch (>= 3.11.4,
        # vgl. requires-python in pyproject.toml) — kein explizites Pinning nötig.
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-lock.txt

      # Dependencies BEWUSST minimal halten:
      #   * requirements-lock.txt – Kern (PyYAML + numpy), dev (pytest) und
      #               Build-Backend (setuptools) mit EXAKTEN Pins + sha256-Hashes.
      #               --require-hashes erzwingt, dass kein ungeprüftes Artefakt aus
      #               PyPI installiert wird; --only-binary verhindert sdist-Builds.
      #               regenerieren: siehe Header von requirements-lock.txt.
      # Ebenfalls bewusst NICHT installiert: die Extras 'llm' (llama-cpp-python) und
      # 'nlp' (spacy). web.py ist reine Stdlib — es gibt kein fastapi/uvicorn-Extra.
      # Das Paket selbst mit --no-build-isolation --no-deps: alle Deps und das
      # Build-Backend kommen aus dem Lock, nicht aus den >=-Ranges in pyproject.toml.
      - name: Install dependencies (Hash-Lock für Kern+dev, kein torch)
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-lock.txt
          python -m pip install --no-build-isolation --no-deps -e .

      # Schnelles, versionsspezifisches "parst es überhaupt?"-Gate vor dem Testlauf.
      - name: Byte-compile
        run: python -m compileall -q risk_layer tests

      # Die Suite ist artefakt-frei: Tests bauen Mini-Normgraph/Embedding-Index selbst
      # aus tests/fixtures/ (kein corpus/graph.sqlite, kein corpus/embedding/ nötig).
      - name: Run tests
        run: python -m pytest -q

      # Gold-Gate (PS-861-Mapping, Lücke L3): deterministisches Regressionsgate —
      # Matcher/Muster/Streit/Zitate gegen eingefrorenes Gold (fixtures/gold/
      # deterministisch_v1.yaml), artefakt-frei wie die Suite (kein Embedding/
      # LLM/GPU). Bewusst ein Step im Test-Job, KEIN eigener Job (Runner-
      # Sparsamkeit). Exit 1 = Regression unter der Schwelle (tools/gold_gate.py).
      - name: Gold-Gate (deterministische Regression)
        run: python tools/gold_gate.py
