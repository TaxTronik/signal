name: Quality

# Bewusst (noch) NICHT in dieser CI: Windows-Runner und PSScriptAnalyzer.
# Windows-Locks werden plattformneutral in security.yml auditiert; Installation
# und pip check bleiben bis zu einem echten Windows-Runner ein dokumentiertes
# manuelles Release-Gate. Ein PS-Parse-Check läuft OPPORTUNISTISCH in build.yml,
# falls pwsh im Runner-Image vorhanden ist.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint + Typpruefung
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-quality-lock.txt

      # Auch die Quality-Tools kommen aus einem Hash-Lock:
      # kein bei jedem Lauf neu aufgeloestes ``pip install ruff`` mehr.
      - name: Install locked quality tools
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-quality-lock.txt

      - name: Ruff (Produktionscode/Tests + Runtime-Gate fuer Tools)
        run: |
          python -m ruff check risk_layer tests
          python -m ruff check --select E9,F63,F7,F82 tools experiments

      - name: Mypy (Produktionscode)
        run: python -m mypy

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # '3.11' resolved im Runner auf den neuesten 3.11-Patch (>= 3.11.4,
        # vgl. requires-python in pyproject.toml) — kein explizites Pinning nötig.
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements-lock.txt
            requirements-quality-lock.txt

      # Dependencies BEWUSST minimal halten:
      #   * requirements-lock.txt – Kern (PyYAML + numpy), dev (pytest) und
      #               Build-Backend (setuptools) mit EXAKTEN Pins + sha256-Hashes.
      #               --require-hashes erzwingt, dass kein ungeprüftes Artefakt aus
      #               PyPI installiert wird; --only-binary verhindert sdist-Builds.
      #               regenerieren: siehe Header von requirements-lock.txt.
      # Ebenfalls bewusst NICHT installiert: die Extras 'llm' (llama-cpp-python) und
      # 'nlp' (spacy). web.py ist reine Stdlib — es gibt kein fastapi/uvicorn-Extra.
      # Das Paket selbst mit --no-build-isolation --no-deps: alle Deps und das
      # Build-Backend kommen aus dem Lock, nicht aus den >=-Ranges in pyproject.toml.
      - name: Install dependencies (Hash-Lock für Kern+dev, kein torch)
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-lock.txt
          python -m pip install --require-hashes --only-binary=:all: -r requirements-quality-lock.txt
          python -m pip install --no-build-isolation --no-deps -e .

      # Schnelles, versionsspezifisches "parst es überhaupt?"-Gate vor dem Testlauf.
      - name: Byte-compile
        run: python -m compileall -q risk_layer tests tools experiments

      # Die Suite ist artefakt-frei: Tests bauen Mini-Normgraph/Embedding-Index selbst
      # aus tests/fixtures/ (kein corpus/graph.sqlite, kein corpus/embedding/ nötig).
      - name: Run tests + Branch-Coverage-Gate
        run: |
          umask 022
          python -m coverage run -m pytest -q
          python -m coverage report

      # Gold-Gate (PS-861-Mapping, Lücke L3): deterministisches Regressionsgate —
      # Matcher/Muster/Streit/Zitate gegen eingefrorenes Gold (fixtures/gold/
      # deterministisch_v1.yaml), artefakt-frei wie die Suite (kein Embedding/
      # LLM/GPU). Bewusst ein Step im Test-Job, KEIN eigener Job (Runner-
      # Sparsamkeit). Exit 1 = Regression unter der Schwelle (tools/gold_gate.py).
      - name: Gold-Gate (deterministische Regression)
        run: python tools/gold_gate.py
