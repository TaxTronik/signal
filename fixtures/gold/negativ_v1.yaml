# Negativ-Gold v1 (EINGEFROREN) — Präzisions-/Abstention-Probe der Semantik-Schicht.
#
# ZWECK: Misst die FEHLVORSCHLAGSQUOTE — den Anteil dieser Sätze, für die eine
# Konfiguration trotzdem ≥1 Norm-Kandidaten liefert. Für JEDEN Satz hier ist die
# korrekte Systemantwort: ABSTINIEREN (kein Vorschlag). Gegenstück zu
# ao_v1/organschaft_v1 (Recall auf Positiven): erst beide Seiten zusammen ergeben
# die ehrliche Tradeoff-Tabelle Recall-Verlust vs. Fehlalarm-Abwehr — genau der
# Zweck des Rerankers (Hub-Fehlalarm-Abwehr, s. risk_layer/reranker.py), der
# ohne dieses Gold unmessbar war.
#
# KRITERIUM (objektiv, je Satz geprüft):
#   1. Kein kuratierter Katalog-BEGRIFF wird ausgedrückt (catalog/begriffe.yaml,
#      Begriffs-/Paraphrasen-Sinn — bloßes Teilen einzelner Wörter ist erlaubt
#      und bei Kategorie steuer_neutral sogar gewollt).
#   2. Kein Norm-Risiko-Kontext: der Satz beschreibt keinen Lebenssachverhalt,
#      der eine steuerliche Würdigung/Prüfung auslöst. Steuer-VOKABULAR ist
#      zulässig, solange es reine Sachstandsmeldung ohne Risikogehalt bleibt
#      („fristgerecht übermittelt", „stimmt überein").
#
# KATEGORIEN (Schwierigkeitsgrade für die Auswertung):
#   alltag             — Alltags-/Geschäftskorrespondenz-Boilerplate
#   juristisch_neutral — juristisch klingende, steuerlich neutrale Sätze
#                        (Vertragsfloskeln, Grußformeln, Terminabsprachen)
#   steuer_neutral     — HART: Steuer-Vokabular ohne Risikogehalt (Sachstand)
#
# Stil-Referenz: examples/beispiel_beschreibung.txt (Negativ-Kontrolle der
# deterministischen Schicht — tatsächliche Schilderung ohne benannte
# Rechtsbegriffe); hier dieselbe Idee für die SEMANTIK-Schicht, satzweise.

