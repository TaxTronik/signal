# =============================================================================
# Gold v1 — Lemma-Robustheitspfad /LF50/ (BINDEND, mechanisch objektiv)
# =============================================================================
# Zweck: Nachweis des /LF50/-Lemma-Pfads (matcher.match_lemma, optionen.lemma).
# Jeder Fall ist EIN grammatisch korrekter deutscher Satz mit einer FLEKTIERTEN
# Form einer echten Katalog-Oberfläche (catalog/begriffe.yaml), die der heutige
# wörtliche Schicht-1-Matcher NICHT findet (beim Erstellen programmatisch
# verifiziert: kein exakter Treffer der begriff_id im Satz). Erwartet werden
# begriff_id und die EXAKTE Oberflächen-Span im Satz (start/end inklusive/
# exklusiv; satz[start:end] == span_text, von tools/lemma_eval.py validiert).
#
# Kategorien: zu-Infinitive/finite Verbformen von Partizip-Aliassen, Umlaut-
# Plurale, Artikel-Kasus in Mehrwort-Oberflaechen (des->der), Komparative/
# Superlative, -nis-Plurale.
#
# bekannt_hart: true  => erfüllt die Gold-Kriterien, ist mit dem heutigen
# Modellstand (de_core_news_lg 3.8) aber NICHT auflösbar (Umlaut-/Partizip-
# Artefakte des Lemmatizers, je Fall im kommentar dokumentiert). Diese Fälle
# bleiben absichtlich drin: sie messen den ehrlichen Restabstand zu 100 %.
#
# Auswertung: python tools/lemma_eval.py  (Recall ohne/mit Lemma, Span-Exaktheit)
# =============================================================================

