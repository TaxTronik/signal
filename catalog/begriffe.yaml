# =============================================================================
# Begriffskatalog – Single Source of Truth der Schicht 1  (/LF220/, /LF230/)
# =============================================================================
# Versionierte, kuratierte Datendatei. GETRENNT vom Code – Änderungen hier
# erfordern KEINEN Code-Deploy (/NF50/) und werden über Git nachvollzogen.
#
# WICHTIG (fachliche Verantwortung): Dieser Seed-Katalog lenkt Aufmerksamkeit,
# er ersetzt KEINE Subsumtion. Norm-Anker und Fundstellen sind vom Berufsträger
# vor produktivem Einsatz zu verifizieren und fortzuschreiben (§§ 33, 57 StBerG).
# Zulässiger Fehlermodus: lieber ein überflüssiger Hinweis als ein übersehener
# Begriff (Recall vor Precision).
#
# Seed-Quelle: Tab. 1 / dogmatische Eckpfeiler des DStR-Beitrags
# „Steuerartenübergreifende Risikosteuerung der Organschaft".
#
# governance_typ:  FP = formal-periodisch | FF = fortlaufend-faktisch | IN = inhärent
# schadensintensitaet: niedrig | mittel | hoch
# kaskadenreichweite:  1 | 2 | 3
#
# NEU in 0.3.0 – ausloeser (Schicht 1b, Beschreibungs-/Negativbefund-Muster):
#   Reale Sachverhalte BENENNEN die Rechtsbegriffe selten – sie UMSCHREIBEN sie,
#   oft als Negativbefund ("Belege fehlen", "Abgaben nicht weitergeleitet"). Ein
#   ausloeser-Muster trifft, wenn in EINEM Satz aus JEDER Wortgruppe mindestens
#   ein Glied vorkommt (Ko-Okkurrenz ⇒ Präzision). Rein deterministisch, kein
#   Modell, kuratierbar. Glieder matchen am Wortanfang (stamm-/präfixtolerant):
#   "fehl" ⇒ fehlt/fehlen/fehlende; "kasse" ⇒ Kasse/Kassenführung, aber NICHT
#   Unterstützungs|kasse (kein Wortanfang) – genau der Realabgleich, an dem die
#   reine Stichwortliste „Unterstützungskasse" mit „Kasse" verwechselt hat.
#   Optional je Muster: ausschlusswoerter sind ebenfalls Wortpräfixe. Dort
#   beginnende Glied-Funde werden ignoriert ("fehl" in "fehlerfrei"); explizite
#   Phrasen wie "nicht fehlerfrei" und andere Satzsignale bleiben erhalten.
#   verneinbare_nomen nennt vollständige Wortformen, deren ausdrücklich
#   verneintes Vorkommen ("keine Mängel", "frei von Fehlern") kein Befund ist.
# =============================================================================

version: "0.3.2"
stand: "2026-05-31"
quelle: "DStR-Beitrag: Steuerartenübergreifende Risikosteuerung der Organschaft; AO-Eckbegriffe"

begriffe:

  # ---------------------------------------------------------------------------
  # Umsatzsteuerliche Organschaft – Eingliederungsmerkmale (§ 2 Abs. 2 Nr. 2 UStG)
  # ---------------------------------------------------------------------------

  - id: ust_finanzielle_eingliederung
    begriff_kanonisch: "finanzielle Eingliederung"
    aliase:
      - "finanziell eingegliedert"
      - "finanzielle Eingliederung in das Unternehmen"
      - "Stimmrechtsmehrheit"
    norm_anker:
      - "§ 2 Abs. 2 Nr. 2 UStG"
    paraphrasen:
      - "Der Organträger verfügt über die entscheidende Stimmrechtsmehrheit und kann Mehrheitsbeschlüsse in der Tochter durchsetzen."
      - "Die Beteiligung vermittelt der Mutter die Mehrheit der Stimmrechte in der Tochter."
    definitionsquelle:
      - typ: "Verwaltung"
        fundstelle: "Abschn. 2.8 Abs. 5 UStAE"
      - typ: "Rspr"
        fundstelle: "BFH v. 18.01.2023 – XI R 29/22"
    governance_typ: "FF"
    schadensintensitaet: "hoch"
    kaskadenreichweite: 2
    trigger_ereignisse:
      - "Anteilsübertragung"
      - "Kapitalerhöhung"
      - "Stimmrechtsvereinbarung"
    gefaehrdungsnotiz: >
      Erfordert Mehrheit der Stimmrechte. Veränderung der Beteiligungs- oder
      Stimmrechtslage kann die Organschaft taggenau beenden – mit Rückwirkung
      auf die Zurechnung der Umsätze.
    gueltig_ab: "2023-01-01"
    gueltig_bis: null

  - id: ust_wirtschaftliche_eingliederung
    begriff_kanonisch: "wirtschaftliche Eingliederung"
    aliase:
      - "wirtschaftlich eingegliedert"
      - "wirtschaftliche Verflechtung"
    norm_anker:
      - "§ 2 Abs. 2 Nr. 2 UStG"
    paraphrasen:
      - "Die Tochter ist durch mehr als nur unerhebliche Leistungsbeziehungen wirtschaftlich in das Unternehmen des Organträgers eingebunden."
      - "Beide Unternehmen sind wirtschaftlich so verflochten, dass die Tätigkeit der Tochter das Gesamtunternehmen der Mutter fördert oder ergänzt."
    definitionsquelle:
      - typ: "Verwaltung"
        fundstelle: "Abschn. 2.8 Abs. 6 UStAE"
    governance_typ: "FF"
    schadensintensitaet: "mittel"
    kaskadenreichweite: 1
    trigger_ereignisse:
      - "Einstellung der Leistungsbeziehung"
      - "Geschäftsfeldänderung"
    gefaehrdungsnotiz: >
      Setzt einen vernünftigen wirtschaftlichen Zusammenhang (Förderung/Ergänzung)
      voraus. Wegfall der Leistungsverflechtung gefährdet das Merkmal.
    gueltig_ab: null
    gueltig_bis: null

  - id: ust_organisatorische_eingliederung
    begriff_kanonisch: "organisatorische Eingliederung"
    aliase:
      - "organisatorisch eingegliedert"
      - "organisatorische Eingliederung in das Unternehmen"
      - "Eingliederung in organisatorischer Hinsicht"
      - "personelle Verflechtung"
    norm_anker:
      - "§ 2 Abs. 2 Nr. 2 UStG"
    paraphrasen:
      - "Die Mutter beherrscht die laufende Geschäftsführung der Tochter und kann ihren Willen im Tagesgeschäft tatsächlich durchsetzen."
      - "Durch Personenidentität in der Geschäftsführung oder institutionell abgesicherte Eingriffsrechte steuert die Mutter die laufende Geschäftsführung der Tochter."
    definitionsquelle:
      - typ: "Verwaltung"
        fundstelle: "Abschn. 2.8 Abs. 7 bis 10 UStAE"
      - typ: "Rspr"
        fundstelle: "BFH v. 18.01.2023 – XI R 29/22"
    governance_typ: "FF"
    schadensintensitaet: "hoch"
    kaskadenreichweite: 1
    trigger_ereignisse:
      - "Geschäftsführerwechsel"
      - "Insolvenzanzeichen"
      - "Umstrukturierung"
    gefaehrdungsnotiz: >
      Endet taggenau kraft Gesetzes; keine Heilung. Wegfall macht Innenumsätze
      zu steuerbaren Außenumsätzen. Laufendes Monitoring zwingend.
    gueltig_ab: null
    gueltig_bis: null

  - id: ust_willensdurchsetzung
    begriff_kanonisch: "Willensdurchsetzung"
    aliase:
      - "Beherrschung der laufenden Geschäftsführung"
      - "Durchsetzung des Willens"
      - "abweichende Willensbildung verhindert"
    norm_anker:
      - "§ 2 Abs. 2 Nr. 2 UStG"
    paraphrasen:
      - "Der Organträger kann seinen Willen in der Organgesellschaft durchsetzen und abweichende Entscheidungen verhindern."
      - "Die Beherrschung ist so stark, dass die Tochter keine vom Organträger abweichende Willensbildung durchsetzen kann."
    definitionsquelle:
      - typ: "Verwaltung"
        fundstelle: "Abschn. 2.8 Abs. 7 UStAE"
    governance_typ: "FF"
    schadensintensitaet: "hoch"
    kaskadenreichweite: 1
    trigger_ereignisse:
      - "Geschäftsführerwechsel"
      - "Entzug von Weisungsrechten"
    gefaehrdungsnotiz: >
      Kern der organisatorischen Eingliederung: Der Organträger muss eine vom
      eigenen Willen abweichende Willensbildung in der Organgesellschaft
      verhindern können. Fällt die Durchsetzungsmöglichkeit weg, entfällt das Merkmal.
    gueltig_ab: null
    gueltig_bis: null

  # ---------------------------------------------------------------------------
  # Ertragsteuerliche Organschaft (§§ 14 ff. KStG)
  # ---------------------------------------------------------------------------

  - id: kst_finanzielle_eingliederung
    begriff_kanonisch: "finanzielle Eingliederung"
    aliase:
      - "Mehrheit der Stimmrechte"
      - "Stimmrechtsmehrheit am Organträger"
    norm_anker:
      - "§ 14 Abs. 1 Satz 1 Nr. 1 KStG"
    normketten:
      - glieder: ["§ 14 KStG", "§ 2 Abs. 2 Satz 2 GewStG"]
        verknuepfung: "iVm"
        hinweis: "Die körperschaftsteuerliche Organschaft (§ 14 KStG) schlägt über § 2 Abs. 2 Satz 2 GewStG auf die Gewerbesteuer durch – kippt sie, kippt auch die GewSt-Organschaft."
    paraphrasen:
      - "Die Muttergesellschaft hält die Stimmenmehrheit und kann in der Tochter durchregieren."
      - "Konzernmutter und Tochter sind so verflochten, dass sie steuerlich wie eine Einheit behandelt werden."
      - "Über die Mehrheit der Anteile beherrscht der eine Betrieb den anderen vollständig."
    definitionsquelle:
      - typ: "Verwaltung"
        fundstelle: "R 14.2 KStR"
    governance_typ: "FP"
    schadensintensitaet: "hoch"
    kaskadenreichweite: 2
    trigger_ereignisse:
      - "Anteilsübertragung"
      - "unterjähriger Beteiligungserwerb"
    gefaehrdungsnotiz: >
      Muss vom Beginn des Wirtschaftsjahrs an ununterbrochen bestehen. Bereits
      eine kurzzeitige Unterbrechung lässt die Organschaft für das gesamte Jahr
      scheitern.
    gueltig_ab: null
    gueltig_bis: null

  - id: kst_tatsaechliche_durchfuehrung
    begriff_kanonisch: "tatsächliche Durchführung"
    aliase:
      - "tatsächliche Durchführung des Gewinnabführungsvertrags"
      - "tatsächlich durchgeführt"
      - "Durchführung des Ergebnisabführungsvertrags"
    norm_anker:
      - "§ 14 Abs. 1 Satz 1 Nr. 3 KStG"
    paraphrasen:
      - "Der Gewinnabführungsvertrag wird über die Jahre tatsächlich gelebt, nicht nur auf dem Papier."
      - "Die vereinbarte Gewinnabführung und Verlustübernahme wird real vollzogen."
    definitionsquelle:
      - typ: "Verwaltung"
        fundstelle: "R 14.5 KStR"
    governance_typ: "FP"
    schadensintensitaet: "hoch"
    kaskadenreichweite: 3
    trigger_ereignisse:
      - "verspätete Ergebnisabführung"
      - "fehlerhafte Bilanzierung der Forderung/Verbindlichkeit"
      - "ausgebliebene Verlustübernahme"
    gefaehrdungsnotiz: >
      Der Gewinnabführungsvertrag muss während seiner gesamten Geltungsdauer
      tatsächlich vollzogen werden. Nichtdurchführung (auch durch Bilanzierungs-
      fehler) kann die Organschaft rückwirkend für die Mindestlaufzeit zerstören.
    gueltig_ab: null
    gueltig_bis: null

  - id: kst_schaedlicher_beteiligungserwerb
    begriff_kanonisch: "schädlicher Beteiligungserwerb"
    aliase:
      - "schädlicher Anteilserwerb"
      - "schädlicher Erwerb"
      - "Anteilsübertragung von mehr als 50 %"
    norm_anker:
      - "§ 8c Abs. 1 KStG"
    paraphrasen:
      - "Mehr als die Hälfte der Anteile wechselt den Eigentümer, und die Verluste der Gesellschaft gehen unter."
      - "Ein neuer Investor übernimmt über 50 % der Anteile; die Verlustvorträge fallen weg."
    definitionsquelle:
      - typ: "Verwaltung"
        fundstelle: "BMF v. 28.11.2017 – IV C 2 - S 2745-a/09/10002 :004 (BStBl I 2017, 1645)"
    governance_typ: "FP"
    schadensintensitaet: "hoch"
    kaskadenreichweite: 2
    trigger_ereignisse:
      - "Anteilsübertragung > 50 %"
      - "Erwerbergruppe / gleichgerichtete Interessen"
      - "Kapitalerhöhung mit Quotenverschiebung"
    gefaehrdungsnotiz: >
      Übertragung von mehr als 50 % der Anteile innerhalb von fünf Jahren lässt
      nicht genutzte Verluste grundsätzlich vollständig untergehen (vorbehaltlich
      Stille-Reserven- und Konzernklausel, § 8c Abs. 1 Sätze 4 ff. KStG).
    gueltig_ab: null
    gueltig_bis: null

  # ---------------------------------------------------------------------------
  # Einkommen-/Körperschaftsteuer – inhärent wertungsoffene Begriffe (IN)
  # ---------------------------------------------------------------------------

  - id: est_gewerbliche_taetigkeit
    begriff_kanonisch: "gewerbliche Tätigkeit"
    aliase:
      - "gewerblich tätig"
      - "Gewerbebetrieb"
      - "gewerbliche Prägung"
    norm_anker:
      - "§ 15 Abs. 2 EStG"
    paraphrasen:
      - "Er kauft und verkauft so häufig und planmäßig, dass es über bloße Vermögensverwaltung hinausgeht."
      - "Die Tätigkeit hat den Zuschnitt eines Betriebs, nicht den eines privaten Anlegers."
      - "Mit eigenem Einsatz und auf Dauer angelegt, um am Markt Gewinn zu erzielen."
    definitionsquelle:
      - typ: "Gesetz"
        fundstelle: "§ 15 Abs. 2 Satz 1 EStG (Legaldefinition Gewerbebetrieb)"
      - typ: "Rspr"
        fundstelle: "BFH-Rspr. zur Abgrenzung Gewerbebetrieb / Vermögensverwaltung"
    governance_typ: "IN"
    schadensintensitaet: "mittel"
    kaskadenreichweite: 1
    trigger_ereignisse:
      - "Häufung von An- und Verkäufen"
      - "Einsatz von Fremdkapital / Branchennähe"
    gefaehrdungsnotiz: >
      Abgrenzung gewerblich / privat-vermögensverwaltend ist eine wertende
      Gesamtbetrachtung. IN-Begriff: nicht automatisch bewertbar – das System
      kennzeichnet nur die Subsumtionsstelle und erzwingt dokumentierte Aufklärung.
    gueltig_ab: null
    gueltig_bis: null

  - id: kst_vga
    begriff_kanonisch: "verdeckte Gewinnausschüttung"
    aliase:
      - "vGA"
      - "verdeckte Gewinnausschüttungen"
      - "Veranlassung durch das Gesellschaftsverhältnis"
    norm_anker:
      - "§ 8 Abs. 3 Satz 2 KStG"
    paraphrasen:
      - "Die GmbH zahlt ihrem Gesellschafter ein überhöhtes Gehalt, das einem fremden Dritten nie gewährt würde."
      - "Der Gesellschafter lässt sich von der eigenen Firma etwas zu einem unüblich hohen Preis vergüten."
    definitionsquelle:
      - typ: "Verwaltung"
        fundstelle: "R 8.5 KStR"
    governance_typ: "IN"
    schadensintensitaet: "hoch"
    kaskadenreichweite: 2
    trigger_ereignisse:
      - "Leistungsbeziehung mit beherrschendem Gesellschafter"
      - "unangemessene Vergütung / fehlende klare Vereinbarung"
    gefaehrdungsnotiz: >
      Vermögensminderung/verhinderte Vermögensmehrung, die durch das Gesellschafts-
      verhältnis veranlasst ist. IN-Begriff: Beurteilung erfordert wertende
      Einzelfallwürdigung (Fremdvergleich) – keine automatische Bewertung.
    gueltig_ab: null
    gueltig_bis: null

  # ---------------------------------------------------------------------------
  # Bewusste LÜCKE (Demonstration /LF160/, /AB40/):
  # Erkannter Begriff OHNE hinterlegte Definitionsquelle ⇒ Rechercheauftrag.
  # ---------------------------------------------------------------------------

  - id: gesamtwuerdigung_tatsaechliche_verhaeltnisse
    begriff_kanonisch: "Gesamtwürdigung der tatsächlichen Verhältnisse"
    aliase:
      - "Gesamtbild der Verhältnisse"
      - "Gesamtbild der tatsächlichen Verhältnisse"
      - "Würdigung der Gesamtumstände"
      - "Gesamtwürdigung"
    norm_anker: []
    definitionsquelle: []          # ← absichtlich leer ⇒ Lücke / Rechercheauftrag
    governance_typ: "IN"
    schadensintensitaet: "mittel"
    kaskadenreichweite: 1
    trigger_ereignisse: []
    gefaehrdungsnotiz: >
      Querschnittlicher Subsumtionsmaßstab vieler Tatbestände. Keine eigenständige
      Definitionsquelle hinterlegt: bewusst als Lücke geführt, damit die Abhängig-
      keit vom konkreten Tatbestand sichtbar bleibt (Negativwissen, /R20/).
    gueltig_ab: null
    gueltig_bis: null

  # ===========================================================================
  # Abgabenordnung (AO) – verfahrensrechtliche Eckbegriffe
  # AO-lastiges, hochaufgeladenes Erstgebiet: viele Sollbruchstellen je Norm.
  # ===========================================================================

  - id: ao_buchfuehrungs_kassenmangel
    begriff_kanonisch: "Mängel der Buchführung / Kassenführung"
    aliase:
      - "Kassenführung"
      - "Ordnungsmäßigkeit der Buchführung"
      - "Kassen-Nachschau"
      - "Beweiskraft der Buchführung"
    norm_anker:
      - "§ 146 AO"
      - "§ 146a AO"
      - "§ 158 AO"
    normketten:
      - glieder: ["§ 146 AO", "§ 158 AO", "§ 162 AO"]
        verknuepfung: "→"
        hinweis: "Ordnungsmangel (§ 146) lässt die Beweiskraft (§ 158) entfallen und eröffnet die Schätzung (§ 162)."
    paraphrasen:
      - "Der Wirt notiert seine Tageslosung nirgends; am Tresen wird einfach kassiert."
      - "Quittungen landen im Müll, eine Registrierkasse gibt es nicht."
      - "Was abends in der Geldschublade liegt, stimmt nie mit den Aufschrieben überein."
    definitionsquelle:
      - typ: "Gesetz"
        fundstelle: "§ 146 AO (Ordnungsvorschriften); § 158 AO (Beweiskraft)"
      - typ: "Verwaltung"
        fundstelle: "AEAO zu § 146"
    governance_typ: "FF"
    schadensintensitaet: "hoch"
    kaskadenreichweite: 3
    trigger_ereignisse:
      - "Kassen-Nachschau / Außenprüfung"
      - "Bargeldintensiver Betrieb"
    ausloeser:
      # Objekt (Kasse/Buchführung/Belege) + Mangel/Abwesenheit im selben Satz.
      - gruppen:
          - ["kasse", "kassenführung", "kasseneinnahme", "bareinnahme", "buchführung", "aufzeichnung", "kassenbuch", "beleg"]
          - ["fehl", "nicht nachvollziehbar", "nicht in der kasse", "nicht vollständig", "unvollständig", "nicht ordnungsgemäß", "mangel", "mängel", "nicht erfasst", "nicht verbucht", "nicht geführt", "nachlässig geführt",
             "nicht fehlerfrei", "nicht mangelfrei", "nicht mängelfrei",
             "keineswegs fehlerfrei", "keineswegs mangelfrei", "keineswegs mängelfrei",
             "nicht immer fehlerfrei", "nicht immer mangelfrei", "nicht immer mängelfrei",
             "nicht durchgängig fehlerfrei", "nicht durchgängig mangelfrei", "nicht durchgängig mängelfrei",
             "nicht frei von mangel", "nicht frei von mängel", "nicht frei von fehler",
             "nicht ohne mangel", "nicht ohne mängel", "nicht ohne fehler"]
        ausschlusswoerter: ["fehlerfrei", "mangelfrei", "mängelfrei"]
        verneinbare_nomen: ["Mangel", "Mängel", "Mängeln", "Fehler", "Fehlern"]
    gefaehrdungsnotiz: >
      Nicht nachvollziehbare oder unvollständige (Kassen-)Aufzeichnungen verletzen
      die Ordnungsvorschriften (§ 146 AO; Einzelaufzeichnung/Registrierkasse
      § 146a AO). Folge: Die Beweiskraft der Buchführung (§ 158 AO) entfällt, womit
      die Schätzungsbefugnis (§ 162 AO) dem Grunde nach eröffnet wird.
    gueltig_ab: null
    gueltig_bis: null

  - id: ao_schaetzung
    begriff_kanonisch: "Schätzung der Besteuerungsgrundlagen"
    aliase:
      - "Schätzungsbefugnis"
      - "griffweise Schätzung"
      - "Schätzung"
    norm_anker:
      - "§ 162 AO"
    normketten:
      - glieder: ["§ 162 AO", "§ 90 AO"]
        verknuepfung: "iVm"
        hinweis: "Verletzte Mitwirkung (§ 90) verschärft den Schätzungsrahmen (§ 162)."
    paraphrasen:
      - "Mangels brauchbarer Zahlen rechnet der Prüfer den Umsatz selbst hoch."
      - "Das Amt legt einen Zuschlag fest, weil die Buchführung nichts hergibt."
      - "Weil nichts Belastbares vorliegt, wird der Gewinn behördlich angesetzt."
    definitionsquelle:
      - typ: "Verwaltung"
        fundstelle: "AEAO zu § 162"
    governance_typ: "FF"
    schadensintensitaet: "mittel"
    kaskadenreichweite: 1
    trigger_ereignisse:
      - "nicht ordnungsmäßige Buchführung"
      - "Verletzung der Mitwirkungspflicht"
    ausloeser:
      # Bemessungs-/Besteuerungsgrundlagen + Schätz-/Erfahrungssatz-Methode.
      - gruppen:
          - ["bemessungsgrundlage", "besteuerungsgrundlage", "umsätze", "umsatz", "einnahmen", "gewinn", "betriebsergebnis"]
          - ["erfahrungssätz", "erfahrungssatz", "schätz", "selbst an", "griffweise", "richtsatz", "hinzuschätz", "sicherheitszuschlag", "äußerer betriebsvergleich"]
    gefaehrdungsnotiz: >
      Schätzung, soweit Besteuerungsgrundlagen nicht ermittelt/berechnet werden
      können. Ergebnis muss schlüssig, wirtschaftlich möglich und vernünftig sein;
      "allgemeine Erfahrungssätze" umschreibt Schätzungsmethoden (Richtsatz,
      äußerer Betriebsvergleich). Schätzungsrahmen ist wertungsoffen.
    gueltig_ab: null
    gueltig_bis: null

  - id: ao_neue_tatsachen
    begriff_kanonisch: "neue Tatsachen oder Beweismittel"
    aliase:
      - "neue Tatsachen"
      - "neue Beweismittel"
      - "nachträglich bekannt gewordene Tatsachen"
    norm_anker:
      - "§ 173 Abs. 1 AO"
    normketten:
      - glieder: ["§ 173 Abs. 1 AO", "§ 169 Abs. 2 AO"]
        verknuepfung: "iVm"
        hinweis: "Änderung nach § 173 nur innerhalb der Festsetzungsfrist (§ 169)."
    paraphrasen:
      - "Lange nach dem fertigen Bescheid stellt sich heraus, dass Einnahmen verschwiegen wurden."
      - "Der längst abgeschlossene Fall wird aufgerollt, weil etwas Verborgenes auftaucht."
      - "Dem Amt fällt erst Jahre danach auf, was bei der Veranlagung niemand wusste."
    definitionsquelle:
      - typ: "Verwaltung"
        fundstelle: "AEAO zu § 173"
    governance_typ: "FF"
    schadensintensitaet: "mittel"
    kaskadenreichweite: 1
    trigger_ereignisse:
      - "Außenprüfung"
      - "Kontrollmitteilung"
    ausloeser:
      # Bestandskräftiger Bescheid + nachträglich bekannt gewordene Umstände.
      - gruppen:
